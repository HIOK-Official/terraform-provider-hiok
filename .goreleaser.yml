version: 2

builds:
  - id: terraform-provider-hiok
    binary: terraform-provider-hiok_v{{ .Version }}
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows, freebsd]
    goarch: [amd64, arm64]
    ignore:
      - goos: freebsd
        goarch: arm64

archives:
  - formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'

release:
  draft: false
  prerelease: auto

changelog:
  use: github-native
